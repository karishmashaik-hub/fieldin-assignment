services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fieldin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fieldin
    ports:
      - "5432:5432"
    volumes:
      - fieldin_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fieldin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  fieldin_pgdata:
